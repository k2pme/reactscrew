<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReactScrew Trading Example</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #06131a;
        --bg-soft: #0d1f28;
        --panel: rgba(8, 23, 31, 0.72);
        --panel-strong: rgba(8, 23, 31, 0.92);
        --line: rgba(255, 255, 255, 0.12);
        --text: #eef6fa;
        --muted: #98b5c6;
        --up: #3dd9b1;
        --down: #ff6262;
        --flat: #9ab4c1;
        --glow: #8fd3ff;
        --shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
      }

      * { box-sizing: border-box; }
      html, body, #root { margin: 0; min-height: 100%; }
      body {
        background:
          radial-gradient(circle at top left, rgba(61, 217, 177, 0.2), transparent 25%),
          radial-gradient(circle at right 10%, rgba(143, 211, 255, 0.16), transparent 22%),
          linear-gradient(180deg, #071219 0%, #051017 100%);
        color: var(--text);
        font-family: "Space Grotesk", sans-serif;
      }

      button, select { font: inherit; }

      .trading-shell {
        position: relative;
        max-width: 1440px;
        margin: 0 auto;
        padding: 32px 20px 80px;
        overflow: hidden;
      }

      .realtime-shell {
        max-width: 100%;
        min-height: 100vh;
        padding: 24px 24px 28px;
      }

      .orb {
        position: absolute;
        border-radius: 999px;
        filter: blur(80px);
        opacity: 0.35;
        pointer-events: none;
      }

      .orb-a {
        width: 220px;
        height: 220px;
        top: 40px;
        right: -40px;
        background: rgba(61, 217, 177, 0.42);
      }

      .orb-b {
        width: 260px;
        height: 260px;
        bottom: 120px;
        left: -80px;
        background: rgba(143, 211, 255, 0.24);
      }

      .hero, .control-bar, .metric-grid, .desk-grid, .signals-grid, .heatmap-grid, .devtools-wrap {
        position: relative;
        z-index: 1;
      }

      .realtime-page, .realtime-stage {
        position: relative;
        z-index: 1;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.45fr 0.8fr;
        gap: 24px;
        align-items: end;
        margin-bottom: 24px;
      }

      .eyebrow, .metric-label, .hero-meta, .muted, .pill, .alert-card small, .journal-card small {
        font-family: "IBM Plex Mono", monospace;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #8fd3ff;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 12px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.3rem, 5vw, 4.6rem);
        line-height: 0.95;
        max-width: 11ch;
      }

      .lede {
        max-width: 56ch;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
        margin-top: 18px;
      }

      .hero-panel, .panel, .metric-card, .heat-tile {
        background: var(--panel);
        border: 1px solid var(--line);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
      }

      .hero-panel {
        padding: 24px;
        border-radius: 28px;
      }

      .hero-price {
        font-size: clamp(2rem, 4vw, 3.4rem);
        font-weight: 700;
      }

      .hero-delta {
        margin-top: 8px;
        font-size: 18px;
        font-weight: 700;
      }

      .hero-delta.up, .asset-change.up, .heat-tile.up strong { color: var(--up); }
      .hero-delta.down, .asset-change.down, .heat-tile.down strong { color: var(--down); }
      .hero-delta.flat, .asset-change.flat { color: var(--flat); }

      .hero-meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
        color: var(--muted);
        font-size: 12px;
      }

      .control-bar {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }

      .tab-row, .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .tab-chip, .ghost-btn, .primary-btn, .select-wrap, .compact {
        border-radius: 999px;
        border: 1px solid var(--line);
      }

      .tab-chip, .ghost-btn, .primary-btn {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        padding: 12px 16px;
        cursor: pointer;
      }

      .tab-chip.active, .primary-btn {
        background: linear-gradient(135deg, rgba(61, 217, 177, 0.2), rgba(143, 211, 255, 0.16));
        border-color: rgba(143, 211, 255, 0.35);
      }

      .select-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px 0 14px;
        background: rgba(255, 255, 255, 0.04);
      }

      .select-wrap select {
        background: transparent;
        color: var(--text);
        border: 0;
        padding: 12px 10px 12px 0;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 22px;
      }

      .metric-card {
        padding: 18px;
        border-radius: 20px;
      }

      .metric-card strong {
        display: block;
        margin-top: 10px;
        font-size: 26px;
      }

      .metric-label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .desk-grid, .signals-grid, .realtime-grid {
        display: grid;
        grid-template-columns: 1.55fr 0.9fr;
        gap: 18px;
      }

      .stack {
        display: grid;
        gap: 18px;
      }

      .panel, .panel-large {
        border-radius: 28px;
        padding: 20px;
      }

      .panel-large {
        background: var(--panel-strong);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .panel-head h2 {
        margin: 0;
        font-size: 19px;
      }

      .panel-head span {
        color: var(--muted);
        font-size: 13px;
      }

      .asset-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .asset-card {
        padding: 18px;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
        border: 1px solid rgba(255,255,255,0.08);
      }

      .asset-card.up { box-shadow: inset 0 0 0 1px rgba(61, 217, 177, 0.22); }
      .asset-card.down { box-shadow: inset 0 0 0 1px rgba(255, 98, 98, 0.22); }

      .asset-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: start;
      }

      .asset-top p, .journal-card p, .alert-card p {
        margin: 0;
        color: var(--muted);
      }

      .asset-top strong, .asset-price {
        display: block;
        margin-top: 4px;
      }

      .asset-price {
        margin-top: 18px;
        font-size: 30px;
        font-weight: 700;
      }

      .asset-change {
        margin-top: 6px;
        font-size: 15px;
        font-weight: 700;
      }

      .pill {
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(255,255,255,0.06);
        color: var(--text);
        font-size: 11px;
        text-transform: uppercase;
      }

      .sparkline {
        width: 100%;
        height: 58px;
        margin-top: 14px;
      }

      .progress-track {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }

      .progress-bar {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #8fd3ff, #3dd9b1);
        transition: width 0.35s ease;
      }

      .progress-bar.workflow {
        background: linear-gradient(90deg, #ffb14a, #ff6262);
      }

      .step-list, .alert-list, .journal-list {
        display: grid;
        gap: 12px;
        margin-top: 14px;
      }

      .workflow-form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field span, .toggle-line span {
        color: var(--muted);
        font-size: 12px;
      }

      .field input, .field select {
        width: 100%;
        padding: 12px 14px;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        font: inherit;
      }

      .toggle-line {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 14px;
      }

      .toggle-line input {
        width: 18px;
        height: 18px;
      }

      .step-row, .alert-card, .journal-card {
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .step-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .step-row.success strong { color: var(--up); }
      .step-row.error strong { color: var(--down); }

      .realtime-toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .realtime-page-head {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: end;
        margin-bottom: 20px;
      }

      .realtime-stage {
        min-height: calc(100vh - 140px);
        padding: 22px;
        border-radius: 32px;
        background: rgba(8, 23, 31, 0.78);
        border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
      }

      .realtime-stage-top {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: end;
        margin-bottom: 18px;
      }

      .realtime-hero {
        display: grid;
        gap: 6px;
      }

      .realtime-chart-panel {
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
        background:
          linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)),
          radial-gradient(circle at top, rgba(143, 211, 255, 0.08), transparent 45%);
      }

      .realtime-chart-host {
        width: 100%;
        min-height: 560px;
      }

      .realtime-bottom {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 16px;
        margin-top: 18px;
        align-items: start;
      }

      .realtime-header {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: end;
        margin-bottom: 18px;
      }

      .realtime-price {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 700;
      }

      .realtime-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        min-width: min(100%, 360px);
      }

      .realtime-stats div {
        padding: 12px 14px;
        border-radius: 18px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .realtime-stats span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
      }

      .realtime-stats strong {
        font-size: 15px;
      }

      .candle-wrap {
        border-radius: 24px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
        background:
          linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)),
          radial-gradient(circle at top, rgba(143, 211, 255, 0.08), transparent 45%);
      }

      .candles {
        width: 100%;
        height: 360px;
        display: block;
      }

      .candle-grid {
        stroke: rgba(255,255,255,0.08);
        stroke-dasharray: 4 8;
      }

      .candle-axis {
        fill: var(--muted);
        font-size: 11px;
        font-family: "IBM Plex Mono", monospace;
        text-anchor: end;
      }

      .candle-wick {
        stroke-width: 2;
      }

      .candle-wick.up, .candle-body.up {
        stroke: var(--up);
        fill: rgba(61, 217, 177, 0.28);
      }

      .candle-wick.down, .candle-body.down {
        stroke: var(--down);
        fill: rgba(255, 98, 98, 0.26);
      }

      .watchlist {
        display: grid;
        gap: 10px;
      }

      .watchlist-inline {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }

      .watch-item {
        width: 100%;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 14px 16px;
        border-radius: 18px;
        color: var(--text);
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        cursor: pointer;
      }

      .watch-item.active {
        border-color: rgba(143, 211, 255, 0.42);
        background: linear-gradient(135deg, rgba(143, 211, 255, 0.12), rgba(61, 217, 177, 0.12));
      }

      .watch-item.up strong { color: var(--up); }
      .watch-item.down strong { color: var(--down); }

      .heatmap-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .heat-tile {
        min-height: 170px;
        padding: 20px;
        border-radius: 26px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 10px;
      }

      .heat-tile strong {
        font-size: 40px;
        line-height: 1;
      }

      .heat-tile small {
        color: var(--muted);
      }

      .alert-card {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: center;
      }

      .alert-card.warning { border-color: rgba(255, 177, 74, 0.32); }
      .alert-card.critical { border-color: rgba(255, 98, 98, 0.34); }
      .alert-card.ack { opacity: 0.66; }

      .journal-card.bullish { border-color: rgba(61, 217, 177, 0.3); }
      .journal-card.bearish { border-color: rgba(255, 98, 98, 0.3); }

      .compact {
        padding: 10px 12px;
        white-space: nowrap;
      }

      .devtools-wrap {
        margin-top: 20px;
      }

      .tone-bullish .hero h1 {
        text-shadow: 0 0 22px rgba(61, 217, 177, 0.12);
      }

      .tone-bearish .hero h1 {
        text-shadow: 0 0 22px rgba(255, 98, 98, 0.12);
      }

      @media (max-width: 1100px) {
        .hero, .desk-grid, .signals-grid, .realtime-grid {
          grid-template-columns: 1fr;
        }

        .realtime-page-head, .realtime-stage-top, .realtime-bottom {
          grid-template-columns: 1fr;
          display: grid;
        }

        .metric-grid, .heatmap-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .workflow-form {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .trading-shell {
          padding: 20px 14px 60px;
        }

        .metric-grid, .asset-grid, .heatmap-grid {
          grid-template-columns: 1fr;
        }

        .control-bar {
          align-items: stretch;
        }

        .tab-row, .actions {
          width: 100%;
        }

        .realtime-header, .realtime-stats {
          grid-template-columns: 1fr;
          display: grid;
        }

        .realtime-shell {
          padding: 14px 12px 24px;
        }

        .realtime-stage {
          min-height: auto;
          padding: 16px;
        }

        .realtime-chart-host {
          min-height: 420px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
